server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy GRIST — appels API en même origine, donc sans CORS ni preflight.
    # Un hôte figé par location (pas de cible dynamique) pour ne pas ouvrir un relais.
    location ^~ /grist-gouv/ {
        proxy_pass https://grist.numerique.gouv.fr/;
        proxy_set_header Host grist.numerique.gouv.fr;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location ^~ /grist-saas/ {
        proxy_pass https://docs.getgrist.com/;
        proxy_set_header Host docs.getgrist.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Page statique unique — fallback vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
